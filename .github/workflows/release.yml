name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute new version
        id: version
        run: |
          current=$(grep '^DOCKER_IMAGE_VERSION' Makefile | cut -d= -f2)
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "mkdocs_version=$(grep '^MKDOCS_VERSION' Makefile | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Update version in files
        run: |
          current="${{ steps.version.outputs.current }}"
          new="${{ steps.version.outputs.new }}"
          sed -i "s/^DOCKER_IMAGE_VERSION:=.*/DOCKER_IMAGE_VERSION:=$new/" Makefile
          find docker -name '*.yml' -exec sed -i "s/mkdocs-golden:$current/mkdocs-golden:$new/g" {} +

      - name: Commit and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Makefile docker/
          git commit -m "release: bump mkdocs-golden to v${{ steps.version.outputs.new }}"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin main
          git push origin "v${{ steps.version.outputs.new }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MKDOCS_VERSION=${{ steps.version.outputs.mkdocs_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mkdocs-golden:${{ steps.version.outputs.new }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mkdocs-golden:latest